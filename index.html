<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
            text-align: center;
        }

        header {
            background: #222;
            color: white;
            padding: 25px;
        }

        h1 {
            margin: 0;
        }

        .container {
            padding: 30px;
        }

        .card {
            display: inline-block;
            background: white;
            width: 220px;
            margin: 15px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        #menu {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🍽️ Restaurant Management System</h1>
        <p>Welcome to our restaurant</p>
    </header>

    <div class="container">
        <h2>Our Menu</h2>

        <button onclick="loadMenu()">View Menu</button>

        <div id="menu"></div>
    </div>

    <script>
        async function loadMenu() {
            const response = await fetch("/menu");
            const menu = await response.json();

            const menuDiv = document.getElementById("menu");

            menuDiv.innerHTML = "";

            menu.forEach(item => {
                menuDiv.innerHTML += `
                    <div class="card">
                        <h3>${item.name}</h3>
                        <p>Price: ₹${item.price}</p>
                    </div>
                `;
            });
        }
    </script>

</body>
</html>
